  mode=next;canvas.hidden=false;$('film').hidden=true;$('poster').hidden=false;$('shaderbar').hidden=false;$('filmbar').hidden=true;$('filmnote').hidden=true;$('detail').hidden=false;
  for(const e of document.querySelectorAll('[data-live]'))e.hidden=next!=='live';for(const e of document.querySelectorAll('[data-replay]'))e.hidden=next!=='replay';
  $('modelnote').textContent=next==='live'?'MuJoCo integrates the original P2 mechanics. The fragment shader only renders them. Emergency power removal can drop the puck. No hardware or safety qualification is implied.':'The shader renders recorded physical states at 120 Hz. This mode is not a new physical solve. The geometry and lighting are procedural.';
  $('notice').textContent='Drag to orbit · Pinch or scroll to zoom';$('run').textContent='Run';activeButtons();dirty=true;
  await draw();if(my!==modeSerial)return;$('overlay').hidden=true;lastClock=0;readout();queueLoop();
 }catch(e){if(my===modeSerial||e.name!=='AbortError')fail(e);}
}
function readout(){
 if(mode==='film')return;const t=mode==='live'&&sim?sim.data.time:time;
 $('status').textContent=t.toFixed(2)+' s · '+(mode==='live'?'LIVE PHYSICS':'RECORDED PHYSICS')+(running?' / RUNNING':' / PAUSED')+' · '+width+' × '+height+' · '+(Number($('samples').value)**2)+' sample(s) · Tiled fragment shader';
 if(mode==='live'&&sim){const q=sim.telemetry();$('telemetry').textContent='Controller: '+q.mode+'\nGripper: '+q.gripper_current_A.toFixed(3)+' A\nPhysics time: '+sim.data.time.toFixed(4)+' s\nGPU frame: '+lastFrameMs.toFixed(0)+' ms';}
 else $('telemetry').textContent='Recorded samples: '+A.frames.length+'\nRigid-part records: 260\nMoving springs: 4\nRobot mesh buffers: 0\nMaterial image textures: 0\nGPU frame: '+lastFrameMs.toFixed(0)+' ms';
}
function queueLoop(){if(loopPending||mode==='film'||document.hidden)return;loopPending=true;requestAnimationFrame(loop);}
async function loop(now){
 loopPending=false;if(mode==='film'||document.hidden)return;
 try{
  const dt=lastClock?Math.min(.1,(now-lastClock)/1000):0;lastClock=now;
  if(running){
   if(mode==='live'&&sim){acc+=dt;const h=sim.model.opt.timestep,n=Math.min(320,Math.floor(acc/h));for(let i=0;i<n;i++)sim.step();physicsStepped+=n;acc=Math.min(acc-n*h,.15);}
   else{time=Math.min(time+dt,9.999);$('seek').value=time;if(time>=9.999){running=false;$('run').textContent='Run';}}
   dirty=true;
  }
  if(dirty)await draw();if(running||dirty)queueLoop();
 }catch(e){fail(e);}
}
function options(){return {nominal:{},weak:{springScale:.9},delayed:{springScale:.9,brakeDelayScale:2,motorOffTime:2.2},friction:{frictionChangeTime:2,frictionAfterScale:.01},noBrakes:{motorOffTime:2.2,brakes:false,enforceLimits:false}}[$('preset').value];}
async function resetState(){
 running=false;lastClock=0;acc=0;time=0;$('seek').value='0';$('run').textContent='Run';
 if(mode==='live'){sim?.destroy();sim=new Controller.ArmSimulation(mj,A.xml,A.p,A.api,options());}
 dirty=true;await draw();
}
$('modeFilm').onclick=()=>showFilm();$('modeReplay').onclick=()=>enterMode('replay');$('modeLive').onclick=()=>enterMode('live');$('cancel').onclick=()=>showFilm('Shader startup cancelled. The embedded film needs no WebGL.');
$('retry').onclick=async()=>{if(renderPromise)try{await renderPromise;}catch{}$('resolution').value='256';$('samples').value='1';if(gl?.isContextLost())replaceCanvas();await enterMode(lastShaderMode);};
$('run').onclick=()=>{if(mode==='replay'&&time>=9.999){time=0;$('seek').value='0';}running=!running;lastClock=0;$('run').textContent=running?'Pause':'Run';readout();queueLoop();};
$('reset').onclick=()=>resetState().catch(fail);$('preset').onchange=()=>resetState().catch(fail);
$('stop').onclick=()=>{if(sim){sim.setOptions({normalStopTime:sim.data.time});running=true;$('run').textContent='Pause';queueLoop();}};
$('estop').onclick=()=>{if(sim){sim.setOptions({estopTime:sim.data.time});running=true;$('run').textContent='Pause';queueLoop();}};
for(const id of ['resolution','samples'])$(id).onchange=()=>{manualQuality=true;dirty=true;queueLoop();};
$('seek').oninput=()=>{running=false;time=Number($('seek').value);$('run').textContent='Run';dirty=true;queueLoop();};
$('home').onclick=()=>{drag=[0,0];zoom=0;dirty=true;queueLoop();};
$('source').onclick=()=>download('ARX-6-P4-Live.glsl',new Blob([A.shader],{type:'text/plain'}));
$('save').onclick=async()=>{
 try{await draw();if(!renderReady||gl.isContextLost())return;gl.disable(gl.SCISSOR_TEST);gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fbo);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,null);gl.blitFramebuffer(0,0,width,height,0,0,width,height,gl.COLOR_BUFFER_BIT,gl.NEAREST);canvas.toBlob(b=>{if(b)download('ARX-6-P4.png',b);},'image/png');}catch(e){fail(e);}
};
window.addEventListener('resize',()=>{dirty=true;queueLoop();});
document.addEventListener('visibilitychange',()=>{lastClock=0;if(document.hidden){running=false;$('run').textContent='Run';$('film').pause();}else queueLoop();});
window.ARX={ready:true,enterMode,showFilm,draw,reset:resetState,
 renderAt:async t=>{if(mode!=='replay')throw Error('Seeking is available only in recorded replay.');running=false;time=Math.max(0,Math.min(9.999,t));$('seek').value=time;dirty=true;await draw();},
 step:async n=>{if(mode!=='live'||!sim)throw Error('Live physics is not loaded.');running=false;for(let i=0;i<n;i++)sim.step();physicsStepped+=n;dirty=true;await draw();},
 pause:()=>{running=false;$('run').textContent='Run';},sim:()=>sim,
 state:()=>mode==='replay'?{time,frame:recordedState(time),recorded:true}:sim?{frame:Array.from(sim.frame()),telemetry:sim.telemetry(),display:mode}:{time,recorded:true},
 setCamera:async(x,y,z)=>{drag=[x,y];zoom=z;dirty=true;await draw();},
 setQuality:async(edge,samples)=>{manualQuality=true;$('resolution').value=String(edge);$('samples').value=String(samples);dirty=true;await draw();},
 diagnostics:()=>({mode,requestedMode,rendererReady:renderReady,webglAllocated:!!gl,contextLost:!!gl?.isContextLost(),mobile,width,height,longEdge:Math.max(width,height),pixels:width*height,samples:Number($('samples').value)**2,maxPixelsPerSubmission,completedFrames,drawCalls,probeCount,buildCount,lossCount,restoreCount,lastFrameMs,adaptiveDrops,physicsStepped,lastLossState,restoredState,shaderSHA:A.shaderSHA,physicsSHA:A.physicsSHA,sceneTriangles:0,sceneTextures:0,internalRenderTargets:1,filmEmbedded:!!A.film,lastError}),
 testLoseContext:()=>{if(!lossExtension)throw Error('WEBGL_lose_context unavailable.');lossExtension.loseContext();},testRestoreContext:()=>lossExtension?.restoreContext()
};
showFilm();
</script></body></html>
