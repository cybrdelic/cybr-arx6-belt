name: Portable ARX core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native CAD and render dependencies
        run: python -m pip install -r ARX-6-P5-Engineering/integration/requirements-p5.txt -r ARX-6-P5-Shader/requirements.txt
      - name: Build real native CAD and run fresh dynamics
        run: |
          python tools/portable.py cad-smoke
          python tools/portable.py physics-smoke
      - name: Build portable WebGL2 viewer
        run: python tools/portable.py viewer-build
      - name: Install browser test runtime
        working-directory: ARX-6-P5-Shader
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Render exact procedural robot in WebGL2
        working-directory: ARX-6-P5-Shader
        env:
          ARX_VIEWER_TIMEOUT_MS: '600000'
        run: node tools/smoke_viewer.cjs
